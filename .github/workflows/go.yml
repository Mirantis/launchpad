name: Go unit tests

# The job checks out the repository, installs Go and runs the unit tests. It
# publishes nothing: no artifacts, no comments, no checks, no OIDC token. Read
# access to the repository contents is all `actions/checkout` requires, and
# module downloads go through the public proxy, which uses no token at all.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - Makefile
      - '.github/workflows/go.yml'

jobs:
  unit-test:
    strategy:
      matrix:
        os: [arc-runner-set-mirantis-public, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: auto


    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod

    - name: Unit Tests
      run: make unit-test
      env:
        TEST_FLAGS: -short
