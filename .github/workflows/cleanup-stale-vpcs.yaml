# Reclaim leaked smoke-test infrastructure.
#
# When a smoke test exceeds its `go test -timeout`, the panic kills the process
# before terratest's deferred `terraform destroy` can run, so the whole stack is
# left behind. Enough of those and the account hits VpcLimitExceeded, at which
# point every later smoke run fails during `terraform apply` for reasons that
# have nothing to do with the code being tested.
#
# Tag a VPC with `launchpad-persist` (any value) to exempt it.

name: Cleanup stale VPCs

on:
  schedule:
    # 03:00 UTC daily, before European working hours.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be deleted without deleting it"
        type: boolean
        default: true
      max_age_hours:
        description: "Delete VPCs older than this many hours"
        type: string
        default: "24"
      region:
        description: "AWS region to clean. A manual run sweeps only this region."
        type: string
        default: "us-west-2"

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete stale VPCs (${{ matrix.region }})
    runs-on: arc-runner-set-mirantis-public
    strategy:
      # One region failing must not cancel or hide the other: a sweep that
      # covered only half the regions and reported success is the failure this
      # matrix exists to prevent.
      fail-fast: false
      matrix:
        # A scheduled run sweeps both regions. A manual run sweeps only the
        # region given in the input, so selecting it here keeps a dispatch from
        # running two legs against the same region.
        #
        # The selection is made in the matrix rather than in a job-level `if`
        # because the `matrix` context is not available there: GitHub evaluates
        # `jobs.<job_id>.if` before expanding the matrix, and referencing
        # `matrix` in it makes the workflow invalid. `jobs.<job_id>.strategy`
        # does have access to `github` and `inputs`.
        #
        # us-west-2 holds the smoke stacks since #681. us-east-1 is still
        # provisioned by test/integration and is the default in both shipped
        # terraform examples, so it accumulates leaks and must stay swept.
        region: >-
          ${{ github.event_name == 'workflow_dispatch'
              && fromJSON(format('["{0}"]', github.event.inputs.region || 'us-west-2'))
              || fromJSON('["us-east-1", "us-west-2"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Delete stale VPCs in ${{ matrix.region }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Scheduled runs delete for real; manual runs default to a dry run so
          # the button is safe to press.
          AWS_REGION: ${{ matrix.region }}
          MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours || '24' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        run: ./.github/scripts/cleanup-stale-vpcs.sh
