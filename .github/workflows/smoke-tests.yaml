name: Smoke Tests

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    paths:
      - "**.go"
      - "**.tf"
      - ".terraform.lock.hcl"
      - "go.mod"
      - "go.sum"
      - "examples/terraform/aws-simple/**"
      - ".github/workflows/smoke-tests.yaml"
  push:
    branches: [main]

# Each `--add-label` call on a PR emits its own `pull_request: labeled`
# event, so labelling three suites in a row starts three identical runs.
# Each run can hold one VPC per suite against a default quota of 5 VPCs per
# region, so stacked runs fail with VpcLimitExceeded during `terraform
# apply` for reasons unrelated to the code under test.
#
# Queue duplicates instead of cancelling them: cancel-in-progress would kill
# terratest between `terraform apply` and its deferred `terraform destroy`,
# leaking a whole stack until the Cleanup stale VPCs workflow reclaims it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke-modern:
    runs-on: arc-runner-set-mirantis-public
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'smoke-test') ||
      contains(github.event.pull_request.labels.*.name, 'smoke-modern')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Run modern smoke test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make smoke-modern

  smoke-legacy:
    runs-on: arc-runner-set-mirantis-public
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'smoke-test') ||
      contains(github.event.pull_request.labels.*.name, 'smoke-legacy')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Run legacy smoke test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make smoke-legacy

  # Bleeding-edge platforms: rhel10, rocky10 and ubuntu26 as both managers and
  # workers. Gated like every other suite in this file -- a push to main, or a
  # smoke-test / smoke-cutting-edge label on a PR.
  smoke-cutting-edge:
    runs-on: arc-runner-set-mirantis-public
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'smoke-test') ||
      contains(github.event.pull_request.labels.*.name, 'smoke-cutting-edge')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Run cutting-edge smoke test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make smoke-cutting-edge

  smoke-windows:
    runs-on: arc-runner-set-mirantis-public
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'smoke-test') ||
      contains(github.event.pull_request.labels.*.name, 'smoke-windows')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Run windows smoke test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make smoke-windows

  smoke-fips:
    runs-on: arc-runner-set-mirantis-public
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'smoke-test') ||
      contains(github.event.pull_request.labels.*.name, 'smoke-fips')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Run FIPS smoke test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make smoke-fips

  smoke-upgrade:
    runs-on: arc-runner-set-mirantis-public
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'smoke-test') ||
      contains(github.event.pull_request.labels.*.name, 'smoke-upgrade')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Run upgrade smoke test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make smoke-upgrade

  # PRODENG-3642. Deliberately omits the `push` trigger and the broad
  # `smoke-test` label: this spends a stack on validation logic that changes
  # rarely, so it is run when that logic is touched rather than every merge.
  smoke-swarm-pool:
    runs-on: arc-runner-set-mirantis-public
    if: contains(github.event.pull_request.labels.*.name, 'smoke-swarm-pool')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Run swarm address pool smoke test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make smoke-swarm-pool

  # MSR runs only when asked for, like smoke-swarm-pool and unlike the
  # version-matrix suites: it is the only suite that installs MSR, it costs an
  # extra instance and ingress, and MSR 2.x pins it to the legacy MCR/MKE
  # stack that no other suite would otherwise pair it with.
  smoke-msr:
    runs-on: arc-runner-set-mirantis-public
    if: contains(github.event.pull_request.labels.*.name, 'smoke-msr')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Run MSR smoke test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make smoke-msr
