# Release workflow for Launchpad
# Triggered on tags (e.g., v1.5.16).

name: Release
permissions:
  contents: read  # Top-level: Restricts all jobs by default

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Release Binaries
    runs-on: arc-runner-set-mirantis-public
    env:
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        # VERSION reaches the shell through the environment, never spliced into
        # the script text. A tag name is chosen by whoever pushes the tag, and
        # git permits `$`, backticks, `;`, `&`, `|` and parentheses in a ref,
        # so expanding it here would let a pushed tag run commands in the job
        # that builds the released binaries.
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          platforms=("linux/amd64" "linux/arm64" "windows/amd64" "windows/arm64" "darwin/amd64" "darwin/arm64" "freebsd/amd64" "freebsd/arm64")
          for platform in "${platforms[@]}"; do
            GOOS=${platform%/*}
            GOARCH=${platform#*/}
            output_name="dist/launchpad_${GOOS}_${GOARCH}_${VERSION#v}"
            if [ "$GOOS" = "windows" ]; then
              output_name+=".exe"
            fi
            echo "Building $output_name"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "-X github.com/Mirantis/launchpad/version.Version=${VERSION#v} -X github.com/Mirantis/launchpad/version.GitCommit=$GITHUB_SHA" -o "$output_name" ./main.go
          done
      - name: Generate checksums
        run: |
          cd dist
          sha256sum launchpad_* > checksums.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: launchpad-release-binaries
          path: dist/

  release:
    name: Create GitHub Release
    runs-on: arc-runner-set-mirantis-public
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout code
        # The release notes are assembled from .changes/ in the repository, so
        # this job needs the tree as well as the built artifacts.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: launchpad-release-binaries
          path: dist/

      - name: Assemble release notes
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          printf '## Release notes\n\n' > "$notes"
          count=0
          for fragment in .changes/PRODENG-*.md; do
            [ -e "$fragment" ] || continue
            # Emitted verbatim rather than prefixed with a list marker: a note
            # may run to several paragraphs, and continuation lines under a
            # bullet would need indenting to stay in the list. The fragment
            # owns its own markdown.
            cat "$fragment" >> "$notes"
            printf '\n' >> "$notes"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            # Stated rather than left blank. An empty section reads as "nothing
            # notable changed"; this release may instead be one where nobody
            # wrote a fragment. The two must not look the same.
            printf '_No release notes were recorded for this release._\n' >> "$notes"
          fi
          echo "Assembled $count fragment(s):"
          cat "$notes"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          # The assembled fragments become the body; GitHub's generated notes
          # (commits and contributors) are appended below them.
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TODO: Add Digicert signing here.
      # TODO: Push signed artifacts to S3 here.
