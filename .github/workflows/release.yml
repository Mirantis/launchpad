# Release workflow for Launchpad
# Triggered on tags (e.g., v1.5.16).

name: Release
permissions:
  contents: read  # Top-level: Restricts all jobs by default

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Release Binaries
    runs-on: arc-runner-set-mirantis-public
    env:
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        # VERSION reaches the shell through the environment, never spliced into
        # the script text. A tag name is chosen by whoever pushes the tag, and
        # git permits `$`, backticks, `;`, `&`, `|` and parentheses in a ref,
        # so expanding it here would let a pushed tag run commands in the job
        # that builds the released binaries.
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          platforms=("linux/amd64" "linux/arm64" "windows/amd64" "windows/arm64" "darwin/amd64" "darwin/arm64" "freebsd/amd64" "freebsd/arm64")
          for platform in "${platforms[@]}"; do
            GOOS=${platform%/*}
            GOARCH=${platform#*/}
            output_name="dist/launchpad_${GOOS}_${GOARCH}_${VERSION#v}"
            if [ "$GOOS" = "windows" ]; then
              output_name+=".exe"
            fi
            echo "Building $output_name"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "-X github.com/Mirantis/launchpad/version.Version=${VERSION#v} -X github.com/Mirantis/launchpad/version.GitCommit=$GITHUB_SHA" -o "$output_name" ./main.go
          done

      # Signing must happen BEFORE checksums are generated. Signing rewrites the
      # binary, so a signature applied after `sha256sum` would publish assets
      # whose bytes do not match the checksums.sha256 published beside them, and
      # verify_release.sh would report every signed asset as a mismatch. The
      # "Add Digicert signing here" TODO further down sits in the `release` job,
      # after checksums and after upload, and is the wrong place for that reason.
      - name: Check DigiCert signing configuration
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_PKC12_CERT: ${{ secrets.SM_CLIENT_PKC12_CERT }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_KEYPAIR_ALIAS: ${{ vars.SM_KEYPAIR_ALIAS }}
        run: |
          set -euo pipefail
          # An unset `vars.X` expands to an empty string rather than failing, so
          # without this check the signing step would fail obscurely or no-op.
          missing=""
          for name in SM_HOST SM_API_KEY SM_CLIENT_PKC12_CERT SM_CLIENT_CERT_PASSWORD SM_KEYPAIR_ALIAS; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::DigiCert signing is not configured. Missing:$missing"
            echo "Set these at repository or organization level before releasing:"
            echo "  secrets:   SM_API_KEY, SM_CLIENT_PKC12_CERT, SM_CLIENT_CERT_PASSWORD"
            echo "  variables: SM_HOST, SM_KEYPAIR_ALIAS"
            exit 1
          fi

      - name: Decode DigiCert client certificate
        env:
          # Dereferenced by the shell from the environment, never interpolated
          # into this script body: a `${{ secrets.* }}` expression inside `run:`
          # is substituted into the script text before the shell parses it.
          SM_CLIENT_PKC12_CERT: ${{ secrets.SM_CLIENT_PKC12_CERT }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/sm_client_cert.p12"
          umask 077
          printf '%s' "$SM_CLIENT_PKC12_CERT" | base64 --decode > "$cert_path"
          echo "SM_CLIENT_CERT_FILE=$cert_path" >> "$GITHUB_ENV"

      - name: Stage Windows binaries for signing
        run: |
          set -euo pipefail
          # Windows executables only. `simple-signing-mode` supports the
          # Authenticode file types, of which .exe is one; it does not support
          # Mach-O or extension-less binaries, so the macOS, linux and freebsd
          # builds cannot be signed this way and are left untouched. See
          # https://docs.digicert.com/en/software-trust-manager/client-tools/signing-tools/files-supported-for-signing.html
          # Passing an unsupported file would either fail the release or be
          # skipped silently, and a skipped signature is indistinguishable from
          # a successful one in the job log.
          mkdir -p sign
          cp dist/launchpad_windows_*.exe sign/
          ls -1 sign/

      - name: Record pre-signing checksums
        run: |
          set -euo pipefail
          # Compared after signing. Nothing else asserts that the action
          # actually signed anything: it is trusted on its exit code, and
          # whether that code aggregates per-file errors is undocumented.
          sha256sum sign/* > "$RUNNER_TEMP/pre-sign.sha256"
          cat "$RUNNER_TEMP/pre-sign.sha256"

      - name: Sign Windows binaries with DigiCert Software Trust Manager
        uses: digicert/code-signing-software-trust-action@fae23a455ba4bde62b64fd7cb2f81ade788f5a95 # v1
        with:
          simple-signing-mode: true
          keypair-alias: ${{ vars.SM_KEYPAIR_ALIAS }}
          input: sign/
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      - name: Verify every staged binary was signed
        run: |
          set -euo pipefail
          # Authenticode rewrites the PE, so an unchanged file was not signed.
          # This is a necessary condition, not a sufficient one: it proves the
          # bytes changed, not that the signature is valid or trusted.
          unchanged=""
          while read -r before name; do
            after=$(sha256sum "$name" | cut -d' ' -f1)
            if [ "$after" = "$before" ]; then
              unchanged="$unchanged $name"
            fi
          done < "$RUNNER_TEMP/pre-sign.sha256"
          if [ -n "$unchanged" ]; then
            echo "::error::Signing reported success but left these files unchanged:$unchanged"
            echo "They would otherwise be checksummed and published as signed."
            exit 1
          fi
          echo "All staged binaries changed after signing."

      - name: Return signed binaries to dist/
        run: |
          set -euo pipefail
          # Named glob rather than sign/*: anything else the signing step leaves
          # in the input directory would become a release asset, since the
          # release job publishes dist/* .
          cp sign/launchpad_*.exe dist/
          rm -rf sign

      - name: Remove decoded signing certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/sm_client_cert.p12"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum launchpad_* > checksums.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: launchpad-release-binaries
          path: dist/

  release:
    name: Create GitHub Release
    runs-on: arc-runner-set-mirantis-public
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout code
        # The release notes are assembled from .changes/ in the repository, so
        # this job needs the tree as well as the built artifacts.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: launchpad-release-binaries
          path: dist/

      - name: Assemble release notes
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          printf '## Release notes\n\n' > "$notes"
          count=0
          for fragment in .changes/PRODENG-*.md; do
            [ -e "$fragment" ] || continue
            # Emitted verbatim rather than prefixed with a list marker: a note
            # may run to several paragraphs, and continuation lines under a
            # bullet would need indenting to stay in the list. The fragment
            # owns its own markdown.
            cat "$fragment" >> "$notes"
            # Two newlines, not one: a fragment that does not end with a
            # newline would otherwise run into the next one and Markdown would
            # render the pair as a single paragraph. A fragment ending with a
            # newline gains a blank line, which Markdown collapses.
            printf '\n\n' >> "$notes"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            # Stated rather than left blank. An empty section reads as "nothing
            # notable changed"; this release may instead be one where nobody
            # wrote a fragment. The two must not look the same.
            printf '_No release notes were recorded for this release._\n' >> "$notes"
          fi
          echo "Assembled $count fragment(s):"
          cat "$notes"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          # The assembled fragments become the body; GitHub's generated notes
          # (commits and contributors) are appended below them.
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # DigiCert signing is not done here: it runs in the `build` job, before
      # checksums are generated, so that checksums.sha256 describes the signed
      # bytes. Signing after this point would publish assets that fail
      # verification against their own checksum record.
      # TODO: Push signed artifacts to S3 here.
